name: purchase_orders
label: 采购订单
icon: contract
enable_api: true
enable_files: true
fields:
  name:
    type: autonumber
    formula: "PO{00000}"
    label: 单号
    searchable: true
    filterable: true
    index: true
    omit: true
    readonly: true
  requisition_id:
    label: 采购需求
    type: lookup
    reference_to: purchase_requisitions
    sortable: true
    filterable: true
    searchable: true
    required: true
    #omit: true
  quotation_id:
    label: 采购报价
    type: lookup
    reference_to: purchase_quotations
    sortable: true
    filterable: true
    searchable: true
    required: true
  partner_id:
    label: 供应商
    type: lookup
    reference_to: accounts
    sortable: true
    filterable: true
    searchable: true
    required: true
  state:
    label: 状态
    type: select
    sortable: true
    options:
      - label: 待验收
        value: waiting
      - label: 已验收
        value: accepted
      - label: 退换处理中
        value: return
    filterable: true
    defaultValue: waiting
    required: true
  order_date: 
    type: date
    label: 订单日期
    omit: true
  payment_terms:
    type: select
    label: 付款条件
    description: 采购付款方式和账期
    options:
      - label: 预付30%，货到付70%
        value: prepaid_30
      - label: 月结30天
        value: net_30
      - label: 月结60天
        value: net_60
      - label: 月结90天
        value: net_90
      - label: 货到付款
        value: cod
      - label: 票到付款
        value: pay_after_invoice
  amount_untaxed:
    label: 未税金额
    type: currency
    omit: true 
  amount_tax:
    label: 税金
    type: currency
    omit: true 
  amount_total:
    label: 合计金额
    type: currency
    omit: true
  amount_qty:
    type: number
    label: 合计数量
    omit: true
list_views:
  all:
    label: 所有采购订单
    columns:
      - name
      - partner_id
      - created
      - order_date
      - payment_terms
      - amount_qty
      - amount_untaxed
      - amount_total
      - owner
      - state
  waiting:
    label: 待验收
    filters: [["state", "=", "waiting"]]
  accepted:
    label: 已验收
    filters: [["state", "=", "accepted"]]
  return:
    label: 退换处理中
    filters: [["state", "=", "return"]]   
relatedList:
  - purchase_orders_lines
  - cms_files 
actions:
  initiateAcceptance: 
    label: "发起验收" 
    on: "record" 
permission_set:
  user:
    allowCreate: true
    allowDelete: true
    allowEdit: true
    allowRead: true
    modifyAllRecords: false
    viewAllRecords: true 
  admin:
    allowCreate: true
    allowDelete: true
    allowEdit: true
    allowRead: true
    modifyAllRecords: true
    viewAllRecords: true
